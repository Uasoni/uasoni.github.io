---
layout: default
---

<article id="home">
    <main>
        {{ content }}
    </main>
    <section class="posts">
        <h2>Recent Posts</h2>
        <ul>
            {% for post in site.posts %}
            <li>
                <a href="{{ post.url }}">{{ post.title }}</a>
            </li>
            {% endfor %}
        </ul>
    </section>
</article>
