---
layout: default
---

<article>
    <header>
        <h1 class="post-title">{{ page.title }}</h1>
        <time datetime="{{ page.date | date_to_xmlschema }}" class="post-date">{{ page.date | date: "%B %e, %Y"}}</time>
        <div class="post-nav">  
            {% if page.previous %}
                <a href="{{ page.previous.url }}" class="post-nav-previous">Previous: {{ page.previous.title }}</a>
            {% endif %}
            {% if page.next %}
                <a href="{{ page.next.url }}" class="post-nav-next">Next: {{ page.next.title }}</a>
            {% endif %}
        </div>
    </header>
    <main class="post-content">
        {{ content }}
    </main>
</article>
