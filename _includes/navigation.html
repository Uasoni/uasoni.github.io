<div class="site-nav">
    <nav>
        {% for item in site.data.navigation %}
            {% assign p = page.url | relative_url %}
            {% assign i = item.url | replace: '.html', '' | relative_url %}
            <a href="{{ i }}" class="nav-item{% if p == i %} active{% endif %}">
            {{ item.name }}
            </a>
        {% endfor %}
    </nav>
</div>
